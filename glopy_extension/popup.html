<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>IA Scraper</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h3 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    button {
      display: block;
      width: 100%;
      padding: 12px 20px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    hr {
      margin: 20px 0;
      border: none;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Scraper Genérico con IA</h3>

    <!-- NUEVO: Selector de tipo de listado -->
    <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
      <label for="listingType" style="display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50;">
        📋 Tipo de Listado:
      </label>
      <select id="listingType" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px;">
        <option value="inmuebles">🏠 Inmuebles / Real Estate</option>
        <option value="vehicles">🚗 Vehículos / Automobiles</option>
      </select>
    </div>

    <button id="btnStart">Iniciar (Plan A)</button>
    <button id="btnDisable">Deshabilitar Extensión</button>
    <hr />
    <button id="btnShowStorage">Ver Storage (Dominios → Selectores)</button>
    <hr/>
    <button id="btnResetDomain">🗑 Resetear dominio actual</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
